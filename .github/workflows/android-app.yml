name: Build Android admin app

# Builds the Husk Admin Android app and puts the APK on the "Releases" page.
# Runs by itself whenever the app folder changes, or press "Run workflow" to build it again.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: npm ci --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: Make the app icon and loading screen
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Use the app's fixed signing key (so updates install over older versions)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk husk-honey-admin.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: husk-honey-admin-apk
          path: android-app/husk-honey-admin.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete admin-app --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create admin-app husk-honey-admin.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Husk Admin app (Android)" \
            --notes "Install file for the Husk & Honey admin app. Built on $(date -u +'%d %b %Y, %H:%M') UTC from commit ${GITHUB_SHA::7}."
